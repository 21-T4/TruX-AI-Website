  <style>
    @font-face {
      font-family: "Anthropic Serif";
      src: url("https://cdn.prod.website-files.com/67ce28cfec624e2b733f8a52/69971a1551eb6cda0d656e8a_AnthropicSerif-Roman-Web.woff2") format("woff2");
      font-style: normal;
      font-weight: 300 800;
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --bg-elevated: #07070a;
      --surface: rgba(255, 255, 255, 0.024);
      --surface-strong: rgba(255, 255, 255, 0.042);
      --surface-featured: linear-gradient(155deg, rgba(108, 181, 255, 0.13), rgba(255, 255, 255, 0.022) 60%);
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --line-accent: rgba(125, 194, 255, 0.38);

      --txt: #f2f2f5;
      --txt-2: #a5a6b2;
      --txt-3: #6e707d;
      --txt-4: #4d4f5c;

      --accent: #8ecbff;
      --accent-strong: #c6e8ff;
      --accent-glow: rgba(75, 163, 255, 0.18);

      --font-serif: "Anthropic Serif", "Instrument Serif", Georgia, "Times New Roman", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --max-w: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      color: var(--txt);
      background:
        radial-gradient(960px 480px at 50% -140px, rgba(87, 173, 255, 0.14), transparent 70%),
        radial-gradient(640px 420px at 88% 18%, rgba(76, 160, 255, 0.06), transparent 65%),
        var(--bg);
      font-family: var(--font-sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 35%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 35%, transparent 100%);
    }

    .wrap {
      width: min(var(--max-w), calc(100% - 48px));
      margin: 0 auto;
    }

    /* Header & Navigation */
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    nav.navbar {
      display: flex;
      height: 74px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--txt);
      text-decoration: none;
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    .brand-tag {
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--txt-2);
      font: 500 10px/1 var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      color: var(--txt-2);
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--txt);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #07111d;
      box-shadow: 0 0 28px rgba(125, 194, 255, 0.18);
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      background: #d8efff;
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(125, 194, 255, 0.28);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--txt);
      border-color: var(--line-strong);
    }

    .btn-secondary:hover,
    .btn-secondary:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.26);
    }

    .btn-code {
      background: rgba(125, 194, 255, 0.08);
      color: var(--accent-strong);
      border-color: rgba(125, 194, 255, 0.32);
    }

    .btn-code:hover,
    .btn-code:focus-visible {
      background: rgba(125, 194, 255, 0.15);
      border-color: rgba(125, 194, 255, 0.58);
      box-shadow: 0 8px 28px rgba(75, 163, 255, 0.12);
      transform: translateY(-1px);
    }

    .nav-label-short {
      display: none;
    }

    .btn-lg {
      min-height: 46px;
      padding: 0 24px;
      font-size: 14px;
    }

    /* Kicker / Eyebrow */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--accent);
      font: 600 11px/1 var(--font-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    /* Hero Section */
    .hero {
      padding: clamp(64px, 9vw, 112px) 0 72px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.03);
      color: var(--txt-2);
      font-size: 12.5px;
      text-decoration: none;
      margin-bottom: 26px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .hero-badge:hover {
      border-color: var(--line-accent);
      background: rgba(125, 194, 255, 0.06);
      color: var(--txt);
    }

    .hero-badge strong {
      color: var(--accent-strong);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 920px;
      margin: 0 auto 22px;
      font-family: var(--font-serif);
      font-size: clamp(44px, 6.4vw, 84px);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--txt);
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent-strong);
    }

    .hero-lede {
      max-width: 660px;
      margin: 0 auto 34px;
      color: var(--txt-2);
      font-size: clamp(16px, 1.8vw, 18.5px);
      line-height: 1.68;
      font-weight: 400;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 56px;
    }

    /* Interactive Workspace Preview */
    .workspace-preview {
      max-width: 1040px;
      margin: 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(18, 19, 26, 0.92), rgba(7, 7, 10, 0.96));
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      overflow: hidden;
      text-align: left;
    }

    .preview-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.45);
    }

    .preview-dots {
      display: flex;
      gap: 7px;
    }

    .preview-dots i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      display: block;
    }

    .preview-mode-pill {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
    }

    .preview-mode-pill span {
      padding: 5px 14px;
      border-radius: 999px;
      font-family: var(--font-serif);
      font-size: 12.5px;
      color: var(--txt-2);
    }

    .preview-mode-pill span.active {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--txt);
      font-weight: 600;
    }

    .preview-status {
      font: 500 11px/1 var(--font-mono);
      color: var(--accent);
    }

    .preview-body {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 0;
    }

    .preview-pane {
      padding: 28px 30px;
    }

    .preview-pane + .preview-pane {
      border-left: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.3);
    }

    .pane-tag {
      display: inline-block;
      margin-bottom: 12px;
      color: var(--txt-3);
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .preview-pane h3 {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--txt);
    }

    .preview-pane p {
      margin: 0 0 20px;
      color: var(--txt-2);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .spec-list {
      display: grid;
      gap: 10px;
    }

    .spec-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      font-size: 13px;
    }

    .spec-row span {
      color: var(--txt-2);
    }

    .spec-row strong {
      color: var(--txt);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
    }

    /* Key Metrics Strip */
    .metrics-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      margin-top: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--line);
      overflow: hidden;
    }

    .metric-cell {
      padding: 24px 22px;
      background: #050507;
      text-align: left;
    }

    .metric-cell strong {
      display: block;
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--txt);
    }

    .metric-cell span {
      display: block;
      margin-top: 6px;
      color: var(--txt-3);
      font: 500 11px/1.35 var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Sections */
    section.section {
      padding: clamp(76px, 9vw, 116px) 0;
    }

    .section-head {
      max-width: 720px;
      margin-bottom: 48px;
    }

    .section-head.centered {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .section-head h2 {
      margin: 0 0 16px;
      font-family: var(--font-serif);
      font-size: clamp(34px, 4.6vw, 56px);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.035em;
      color: var(--txt);
    }

    .section-head p {
      margin: 0;
      color: var(--txt-2);
      font-size: 16.5px;
      line-height: 1.68;
    }

    /* Capabilities Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .bento-card {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      transition: border-color 0.22s ease, background 0.22s ease, transform 0.22s ease;
    }

    .bento-card:hover {
      border-color: var(--line-strong);
      background: var(--surface-strong);
      transform: translateY(-2px);
    }

    .bento-icon {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      margin-bottom: 22px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(125, 194, 255, 0.08);
      color: var(--accent-strong);
      font-size: 16px;
    }

    .bento-card h3 {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--txt);
    }

    .bento-card p {
      margin: 0;
      color: var(--txt-2);
      font-size: 14px;
      line-height: 1.65;
    }

    .product-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .product-card {
      min-height: 300px;
      padding: clamp(26px, 3.5vw, 38px);
    }

    .product-kicker {
      margin: 0 0 10px;
      color: var(--accent);
      font: 600 10.5px/1.4 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .product-card h3 {
      margin-bottom: 12px;
      font-size: clamp(28px, 3vw, 36px);
    }

    .product-card p {
      max-width: 480px;
      margin-bottom: 26px;
      font-size: 14.5px;
    }

    .product-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      margin-top: auto;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .product-link:hover {
      color: #e1f3ff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Live newsroom feed */
    .updates-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .updates-heading .section-head {
      margin-bottom: 30px;
    }

    .updates-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
      margin-bottom: 38px;
      color: var(--txt-2);
      font: 500 11px/1.4 var(--font-mono);
      letter-spacing: 0.03em;
    }

    .updates-status::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: #858895;
    }

    .updates-status.is-live::before {
      background: #71dca5;
      box-shadow: 0 0 12px rgba(113, 220, 165, 0.55);
    }

    .updates-status.is-error::before {
      background: #f0b36c;
      box-shadow: 0 0 10px rgba(240, 179, 108, 0.35);
    }

    .updates-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
    }

    .update-card {
      min-height: 252px;
      color: inherit;
      text-decoration: none;
    }

    .update-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--txt-3);
      font: 500 10px/1.4 var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .update-category {
      color: var(--accent);
    }

    .update-card h3 {
      margin: 0 0 12px;
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      line-height: 1.16;
      letter-spacing: -0.02em;
      color: var(--txt);
    }

    .update-card p {
      margin: 0 0 24px;
      color: var(--txt-2);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .update-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      color: var(--accent-strong);
      font-size: 12.5px;
      font-weight: 600;
    }

    .updates-empty {
      grid-column: 1 / -1;

  <script>
    (() => {
      const FEED_URL = "https://technology.trux.website/data/news-index.json";
      const NEWSROOM_ORIGIN = "https://technology.trux.website";
      const feed = document.getElementById("updates-feed");
      const status = document.getElementById("updates-status");
      const checked = document.getElementById("updates-checked");

      if (!feed || !status || !checked) return;

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]);
      }

      function storyUrl(value) {
        try {
          const url = new URL(String(value ?? ""), NEWSROOM_ORIGIN + "/");
          return url.origin === NEWSROOM_ORIGIN && url.protocol === "https:" ? url.href : null;
        } catch {
          return null;
        }
      }

      function setFeedStatus(kind, message) {
        status.className = "updates-status" + (kind ? " " + kind : "");
        status.textContent = message;
      }

      function formatCheckedTime() {
        checked.textContent = "Feed checked " + new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit"
        }).format(new Date());
      }

      function renderStory(story) {
        const url = storyUrl(story.url);
        if (!url || !String(story.headline ?? "").trim()) return "";

        const published = new Date(story.datePublished);
        const validDate = !Number.isNaN(published.getTime());
        const dateLabel = validDate
          ? new Intl.DateTimeFormat(undefined, { year: "numeric", month: "short", day: "numeric" }).format(published)
          : "TruX update";
        const dateTime = validDate ? published.toISOString() : "";

        return '<a class="bento-card update-card" href="' + escapeHtml(url) + '">' +
          '<div class="update-meta"><span class="update-category">' + escapeHtml(story.category || "UPDATE") +
          '</span><time datetime="' + escapeHtml(dateTime) + '">' + escapeHtml(dateLabel) + '</time></div>' +
          '<h3>' + escapeHtml(story.headline) + '</h3>' +
          '<p>' + escapeHtml(story.description || "Read the full update from the TruX Technology newsroom.") + '</p>' +
          '<span class="update-link">Read story <span aria-hidden="true">↗</span></span></a>';
      }

      async function loadLiveUpdates() {
        try {
          const response = await fetch(FEED_URL, {
            cache: "no-store",
            headers: { "Accept": "application/json" }
          });
          if (!response.ok) throw new Error("The newsroom feed returned " + response.status);

          const stories = await response.json();
          if (!Array.isArray(stories)) throw new Error("The newsroom feed has an unexpected format");

          const latest = stories
            .filter((story) => story && storyUrl(story.url) && String(story.headline ?? "").trim())
            .sort((a, b) => {
              const timeA = new Date(a.datePublished).getTime();
              const timeB = new Date(b.datePublished).getTime();
              return (Number.isNaN(timeB) ? 0 : timeB) - (Number.isNaN(timeA) ? 0 : timeA);
            })
            .slice(0, 3);

          const cards = latest.map(renderStory).filter(Boolean);
          feed.innerHTML = cards.length
            ? cards.join("")
            : '<p class="updates-empty">No newsroom stories are published yet. Visit the newsroom for the latest product information.</p>';

          setFeedStatus("is-live", "Live newsroom feed connected");
          formatCheckedTime();
        } catch (error) {
          feed.innerHTML = '<p class="updates-empty">The live feed could not be loaded right now. Open the TruX Newsroom to check for current updates.</p>';
          setFeedStatus("is-error", "Live feed temporarily unavailable");
          formatCheckedTime();
        }
      }

      loadLiveUpdates();
      window.setInterval(() => {
        if (document.visibilityState === "visible") loadLiveUpdates();
      }, 5 * 60 * 1000);
    })();
  </script>
